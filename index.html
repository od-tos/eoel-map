  }

  const parameters = new URLSearchParams(window.location.search);
  const requestedMap = parameters.get("map") || "eoel";

  const selectedMap = maps[requestedMap];

  if (!selectedMap) {
    document.getElementById("map").innerHTML = `
      <div class="map-error">
        <strong>Die gewünschte Karte wurde nicht gefunden.</strong>
        <span>Unbekannter Kartenname: ${requestedMap}</span>
      </div>
    `;

    throw new Error(`Unbekannte Karte: ${requestedMap}`);
  }

  document.title = selectedMap.title;

  document.querySelector(".map-title strong").textContent =
    selectedMap.title;

  document.querySelector(".map-title span").textContent =
    selectedMap.subtitle;

const popup = document.getElementById("location-popup");
const popupTitle = document.getElementById("location-popup-title");
const popupDescription = document.getElementById(
  "location-popup-description"
);
const popupCloseButton = document.getElementById(
  "location-popup-close"
);

function openLocationPopup(location) {
  console.log("Marker angeklickt:", location.title);
  popupTitle.textContent = location.title;
  popupDescription.replaceChildren();

  for (const paragraphText of location.paragraphs ?? []) {
    const paragraph = document.createElement ("p");
    paragraph.textContent = paragraphText;
    popupDescription.appendChild(paragraph);
  }

  if (location.url) {
  const link = document.createElement("a");

  link.href = location.url;
  link.target = "_parent";
  link.rel = "noopener";
  link.className = "location-popup-link";
  link.textContent = "Artikel im Wiki öffnen";

  popupDescription.appendChild(link);
}

  popup.classList.add("is-visible");
  popup.setAttribute("aria-hidden", "false");

  popupCloseButton.focus();
}

function closeLocationPopup() {
  popup.classList.remove("is-visible");
  popup.setAttribute("aria-hidden", "true");
}

popupCloseButton.addEventListener("click", closeLocationPopup);

document.addEventListener("keydown", function (event) {
  if (event.key === "Escape") {
    closeLocationPopup();
  }
});

  const viewer = OpenSeadragon({
    id: "map",

    prefixUrl: "openseadragon/images/",

    tileSources: selectedMap.source,

    showNavigator: true,
    navigatorPosition: "BOTTOM_RIGHT",

    showNavigationControl: true,
    showZoomControl: true,
    showHomeControl: true,
    showFullPageControl: true,
    showRotationControl: false,

    animationTime: 0.8,
    blendTime: 0.1,
    springStiffness: 7,

    minZoomImageRatio: 0.85,
    maxZoomPixelRatio: 3,

    visibilityRatio: 0.75,
    constrainDuringPan: true,

    preserveViewport: false,
    immediateRender: false,

    gestureSettingsMouse: {
      clickToZoom: false,
      dblClickToZoom: true,
      scrollToZoom: true,
      dragToPan: true
    },

    gestureSettingsTouch: {
      clickToZoom: false,
      dblClickToZoom: true,
      pinchToZoom: true,
      dragToPan: true,
      flickEnabled: true
    }
  });

  viewer.addHandler("open", function () {
  const tiledImage = viewer.world.getItemAt(0);

  if (!tiledImage) {
    console.error("Das Kartenbild wurde nicht gefunden.");
    return;
  }

  for (const location of selectedMap.locations ?? []) {
    const marker = document.createElement("button");

    marker.type = "button";
    marker.className = "map-marker";
    marker.id = `marker-${location.id}`;
    marker.textContent = location.symbol ?? "●";
    marker.title = location.title;
    marker.setAttribute(
      "aria-label",
      `Informationen zu ${location.title} anzeigen`
    );

   new OpenSeadragon.MouseTracker({
  element: marker,

  clickHandler: function (event) {
    event.preventDefaultAction = true;
    openLocationPopup(location);
  },

  pressHandler: function (event) {
    event.preventDefaultAction = true;
  },

  releaseHandler: function (event) {
    event.preventDefaultAction = true;
  }
});

    const imagePoint = new OpenSeadragon.Point(
      location.x,
      location.y
    );

    const viewportPoint =
      tiledImage.imageToViewportCoordinates(imagePoint);

    viewer.addOverlay({
      element: marker,
      location: viewportPoint,
      placement: OpenSeadragon.Placement.BOTTOM
    });
  }
});

//Temporaerr fuer Koordinatenermittlung

viewer.addHandler("canvas-click", function (event) {
  if (!event.quick) {
    return;
  }

  const tiledImage = viewer.world.getItemAt(0);

  if (!tiledImage) {
    return;
  }

  const viewportPoint =
    viewer.viewport.pointFromPixel(event.position);

  const imagePoint =
    tiledImage.viewportToImageCoordinates(viewportPoint);

  console.log({
    x: Math.round(imagePoint.x),
    y: Math.round(imagePoint.y)
  });
});

  viewer.addHandler("open-failed", function (event) {
    console.error("Die Karte konnte nicht geladen werden:", event);

    document.getElementById("map").innerHTML = `
      <div class="map-error">
        <strong>Die Karte konnte nicht geladen werden.</strong>
        <span>Überprüfe die DZI-Datei: ${selectedMap.source}</span>
      </div>
    `;
  });
</script>
